<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>JWT Decoder</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="JwtDecoder.App.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div id="app"></div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        // The app sets the theme from the user's choice; until then match the system so there's no flash
        window.jwtDecoder = {
            setTheme: theme => document.documentElement.dataset.theme = theme
        };
        jwtDecoder.setTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
